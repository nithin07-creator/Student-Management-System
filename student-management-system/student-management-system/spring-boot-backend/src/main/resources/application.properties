# Server
server.port=8080

# Database — H2 file-based (SQLite-equivalent zero-setup embedded DB for the JVM;
# Spring/Hibernate's SQLite dialect support is unreliable, so H2 is the closest
# drop-in for a single-file, no-server database in this stack)
spring.datasource.url=jdbc:h2:file:./data/studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console (visit http://localhost:8080/h2-console while running, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
